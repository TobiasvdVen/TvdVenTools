[package]
name = "tt"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"

[lints.rust]
unused_results = "warn"

[lints.clippy]
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
